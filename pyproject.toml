[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-skull"
version = "0.1.0"
description = "Project Skull: a modular LLM training framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "sentencepiece>=0.2.0",
  "torch>=2.2",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
accelerate = [
  "accelerate>=1.0",
]
web = [
  "fastapi>=0.111",
  "httpx>=0.28",
  "pandas>=2.2",
  "streamlit>=1.44",
  "uvicorn>=0.30",
]

[project.scripts]
skull-web = "skull.web.__main__:main"

[tool.setuptools.packages.find]
include = ["skull*"]

[tool.setuptools.package-data]
"skull.web" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
